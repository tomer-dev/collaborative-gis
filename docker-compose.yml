services:
  postgis:
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_USER: cgis
      POSTGRES_PASSWORD: cgis
      POSTGRES_DB: cgis
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      # Bound to loopback only: dev credentials must not be reachable from the LAN.
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cgis -d cgis']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # PG 18 images set PGDATA=/var/lib/postgresql/18/docker; mount the parent (the image VOLUME).
      - postgis-data:/var/lib/postgresql
  # The API on workerd (`wrangler dev`), opt-in: `docker compose --profile api up`.
  # `docker compose up` alone still starts only PostGIS (CI and scripts/db-lane.sh rely on that).
  api:
    profiles: [api]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      # Service-internal address; the host keeps 127.0.0.1:5433.
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://cgis:cgis@postgis:5432/cgis
      DATABASE_URL: postgresql://cgis:cgis@postgis:5432/cgis
    # Real init: `docker compose down` / Ctrl-C reach pnpm, wrangler and workerd promptly.
    init: true
    volumes:
      # Worker secrets stay on the host: `cp apps/api/.dev.vars.example apps/api/.dev.vars` first.
      # Long syntax so a missing file fails `up` loudly instead of becoming a host directory.
      - type: bind
        source: ./apps/api/.dev.vars
        target: /app/apps/api/.dev.vars
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:8787:8787'
volumes:
  postgis-data:
