services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cgis
      POSTGRES_PASSWORD: cgis
      POSTGRES_DB: cgis
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cgis -d cgis']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgis-data:/var/lib/postgresql/data
volumes:
  postgis-data:
