<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative GIS</title>
    <!-- pre-mount skeleton; replaced by AppFrame. Paints before any JS, so it re-declares the four
         tokens it uses (--color-bg-raised, --color-line, --color-fg, --color-map-bg) with their
         tokens.css values for both colour schemes; styles/tokens.test.ts fails when they drift. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #skeleton {
        --color-bg-raised: oklch(100% 0 0);
        --color-line: oklch(91.5% 0.005 97);
        --color-fg: oklch(15% 0 0);
        --color-map-bg: oklch(91.5% 0.005 97);
        display: flex;
        flex-direction: column;
        height: 100%;
        font:
          600 1.25rem/1.75rem 'Inter Variable',
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      #skeleton header {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        height: 3rem;
        padding: 0 1rem;
        border-bottom: 1px solid var(--color-line);
        background: var(--color-bg-raised);
        color: var(--color-fg);
      }
      #skeleton main {
        flex: 1;
        background: var(--color-map-bg);
      }
      @media (prefers-color-scheme: dark) {
        #skeleton {
          --color-bg-raised: oklch(21.7% 0.004 97);
          --color-line: oklch(28.9% 0.006 97);
          --color-fg: oklch(97.9% 0.001 97);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="skeleton">
        <header>Collaborative GIS</header>
        <main></main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
