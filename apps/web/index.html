<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative GIS</title>
    <meta
      name="description"
      content="Real-time collaborative map editor: draw and measure areas together, with live drafts, presence and versioned areas."
    />
    <meta property="og:title" content="Collaborative GIS" />
    <meta
      property="og:description"
      content="Real-time collaborative map editor: draw and measure areas together, with live drafts, presence and versioned areas."
    />
    <meta property="og:image" content="https://collaborative-gis.tomersharoni.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:url" content="https://collaborative-gis.tomersharoni.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- pre-mount skeleton; replaced by AppFrame. Paints before any JS, so it re-declares the five
         tokens it uses (--color-bg-raised, --color-line, --color-line-control, --color-fg,
         --color-map-bg) with their tokens.css values for both colour schemes;
         styles/tokens.test.ts fails when they drift. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #skeleton {
        --color-bg-raised: oklch(100% 0 0);
        --color-line: oklch(91.5% 0.005 97);
        --color-line-control: oklch(58.5% 0.009 97);
        --color-fg: oklch(15% 0 0);
        --color-map-bg: oklch(91.5% 0.005 97);
        display: flex;
        flex-direction: column;
        height: 100%;
        font:
          600 1.25rem/1.75rem 'Inter Variable',
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      #skeleton header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-shrink: 0;
        height: 3rem;
        padding: 0 0.75rem;
        border-bottom: 1px solid var(--color-line);
        background: var(--color-bg-raised);
        color: var(--color-fg);
      }
      /* As AppFrame lays it out: the name truncates; below sm only the menu button's box shows. */
      #skeleton .title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The bar's end as AppFrame draws it at sm and up: the Guide button, then (remembered only)
         the session menu's box: avatar slot, name bar, invisible sign-out button. */
      #skeleton .end,
      #skeleton .session {
        display: none;
        flex-shrink: 0;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 500;
      }
      #skeleton .menu,
      #skeleton .guide,
      #skeleton .avatar,
      #skeleton .button {
        flex-shrink: 0;
      }
      #skeleton .menu,
      #skeleton .guide,
      #skeleton .button {
        display: inline-flex;
        align-items: center;
        height: 2rem;
        padding: 0 0.75rem;
        border: 1px solid var(--color-line-control);
        border-radius: 0.375rem;
      }
      #skeleton .menu {
        width: 2rem;
        padding: 0;
      }
      #skeleton .button {
        visibility: hidden;
      }
      #skeleton .avatar,
      #skeleton .name {
        background: var(--color-line);
      }
      #skeleton .avatar {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
      }
      #skeleton .name {
        min-width: 1rem;
        width: 4rem;
        height: 1rem;
        border-radius: 0.25rem;
      }
      @media (min-width: 40rem) {
        #skeleton header {
          padding: 0 1rem;
        }
        #skeleton .menu {
          display: none;
        }
        #skeleton .end,
        #skeleton[data-remembered] .session {
          display: flex;
        }
      }
      #skeleton main {
        flex: 1;
        background: var(--color-map-bg);
      }
      @media (prefers-color-scheme: dark) {
        #skeleton {
          --color-bg-raised: oklch(21.7% 0.004 97);
          --color-line: oklch(28.9% 0.006 97);
          --color-line-control: oklch(58.5% 0.009 97);
          --color-fg: oklch(97.9% 0.001 97);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="skeleton">
        <header>
          <span class="title">Collaborative GIS</span>
          <span class="menu"></span>
          <span class="end">
            <span class="guide">Guide</span>
            <span class="session">
              <span class="avatar"></span><span class="name"></span
              ><span class="button">Sign out</span>
            </span>
          </span>
        </header>
        <main></main>
      </div>
      <script>
        // Same reserve as the checking frame: only for a browser signed in last time
        // (AUTH.SIGNED_IN_HINT_KEY / VALUE; src/routes/-skeleton.test.tsx ties the literals).
        try {
          if (localStorage.getItem('cgis.signedIn') === '1')
            document.getElementById('skeleton').dataset.remembered = '';
        } catch {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
