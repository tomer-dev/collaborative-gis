name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_USER: cgis
          POSTGRES_PASSWORD: cgis
          POSTGRES_DB: cgis
        # Host port 5433 matches localConnectionString in apps/api/wrangler.jsonc.
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cgis -d cgis" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: wrangler dry run
        run: pnpm --filter @cgis/api exec wrangler deploy --dry-run --outdir dist
