name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The checks that need no database or browser run on the slim image (1 vCPU, a 15-minute limit):
  # install, lint, format, the constants doc and the typecheck finish in a few minutes there.
  checks:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # docs/constants.md is generated from packages/shared/src/constants/; fails when it is stale.
      - run: pnpm constants:docs --check
      - run: pnpm typecheck
  # Tests, the API contract batch and the builds need the PostGIS service container, so a full VM.
  ci:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_USER: cgis
          POSTGRES_PASSWORD: cgis
          POSTGRES_DB: cgis
        # Host port 5433 matches localConnectionString in apps/api/wrangler.jsonc.
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cgis -d cgis" --health-interval 5s --health-timeout 3s --health-retries 10 --health-start-period 10s
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generating from apps/api/src/db/*schema.ts writes nothing: drizzle/ matches the schema.
      - name: migrations match the schema
        run: |
          pnpm --filter @cgis/api exec drizzle-kit generate
          test -z "$(git status --porcelain apps/api/drizzle)"
      # The workerd tests reach this database through Hyperdrive's localConnectionString.
      - name: migrate
        run: pnpm --filter @cgis/api db:migrate
        env:
          DATABASE_URL: postgresql://cgis:cgis@localhost:5433/cgis
      - run: pnpm test
      # The API contract, apps/api/batch/areas.jsonl, on workerd against the database migrated above
      # (0000-0003, through HYPERDRIVE's localConnectionString). hono batch keeps cookies between steps
      # like a browser, so the sign-in step signs the area steps in. It exits 0 even when a step
      # fails, so jq checks the summary. The secrets are test-only values (wrangler reads process.env).
      - name: api contract batch
        working-directory: apps/api
        env:
          BETTER_AUTH_SECRET: test-only-better-auth-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:8787
        run: |
          pnpm exec hono batch --compact batch/areas.jsonl --runtime workerd > "$RUNNER_TEMP/batch.json"
          cat "$RUNNER_TEMP/batch.json"
          jq -e '.data.summary.failed == 0' "$RUNNER_TEMP/batch.json"
      # The web project's `tsc -b` references the api project, whose bindings come from the
      # generated Worker types (`pnpm types`); the checks job generates them on its own runner.
      - name: worker types
        run: pnpm --filter @cgis/api types
      - name: web build
        run: pnpm --filter @cgis/web build
      # Static build only (D18 reduced): proves every story and .storybook file compiles. Story
      # play functions and a11y checks run in the Storybook UI; the browser run is the e2e job.
      - name: storybook build
        run: pnpm --filter @cgis/web build-storybook
      # The production config (env.production: assets from the web build above, its own bindings).
      - name: wrangler dry run
        run: pnpm --filter @cgis/api exec wrangler deploy --dry-run --env production --outdir dist
  # Two-browser end to end (`pnpm e2e`, apps/web/e2e): Playwright starts `wrangler dev` and Vite
  # itself (webServer) against a lane database it empties and migrates on this job's PostGIS. CI
  # runs the `chromium` project only: the `aerial` project loads govmap's tiles from its CDN, so
  # playwright.config.ts leaves it out when CI is set. `pnpm bench` (k6) is never run here.
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_USER: cgis
          POSTGRES_PASSWORD: cgis
          POSTGRES_DB: cgis
        # scripts/db-lane.sh creates the e2e lane database on this server (127.0.0.1:5433).
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cgis -d cgis" --health-interval 5s --health-timeout 3s --health-retries 10 --health-start-period 10s
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: playwright chromium
        run: pnpm --filter @cgis/web exec playwright install --with-deps chromium
      # The Worker's secrets are test-only values (no apps/api/.dev.vars here; wrangler reads env).
      - name: e2e
        run: pnpm e2e
        env:
          BETTER_AUTH_SECRET: test-only-better-auth-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:8787
      - name: e2e traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: apps/web/node_modules/.e2e-results/
          retention-days: 7
