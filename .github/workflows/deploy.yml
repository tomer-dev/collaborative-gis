name: deploy
# Production deploy of the one Worker (SPA + API + Durable Objects). Owner setup: docs/deploy.md.
# Runs once `ci` has passed on a push to main (the merge commit itself), or on demand.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One production deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # Off until the owner sets the repository variable DEPLOY_ENABLED to true, the last step of
    # docs/deploy.md (a fork never has it). A job-level `if` reads variables, not secrets: a
    # missing secret fails the step that needs it. A `ci` run that failed or was cancelled deploys
    # nothing; only a push run on main counts.
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    # A pinned VM image, never `ubuntu-latest` (the image moves under the job) and not the slim
    # label (a container on a shared VM with no version in its name): this job holds the secrets.
    runs-on: ubuntu-24.04
    # The secrets can move from the repository to this environment (Settings → Environments).
    environment: production
    steps:
      # The commit `ci` checked (workflow_run's own default is the branch's newest commit).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The origin is never in the repository; the deploy step passes it to the Worker as vars.
      - name: production origin is set
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: |
          if [ -z "$PRODUCTION_ORIGIN" ]; then
            echo "::error::the repository variable PRODUCTION_ORIGIN is not set (docs/deploy.md)"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Neon's direct (non-pooled) URL: migrations never go through Hyperdrive. They run before the
      # deploy, so the new Worker never meets an older schema; write them backward compatible,
      # because the running Worker meets the new schema until the deploy finishes.
      - name: migrate
        run: pnpm --filter @cgis/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # apps/web's `tsc -b` reads the Worker's generated binding types (worker-configuration.d.ts).
      - name: worker types
        run: pnpm --filter @cgis/api types
      - name: web build
        run: pnpm --filter @cgis/web build
      # `deploy` is `wrangler deploy --minify`; the assets are uploaded from apps/web/dist. SPA and
      # API share one origin, so CLIENT_ORIGIN and BETTER_AUTH_URL get the same value.
      - name: deploy
        run: >-
          pnpm --filter @cgis/api run deploy --env production
          --var "CLIENT_ORIGIN:$PRODUCTION_ORIGIN" --var "BETTER_AUTH_URL:$PRODUCTION_ORIGIN"
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
