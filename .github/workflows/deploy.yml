name: deploy
# Production deploy of the one Worker (SPA + API + Durable Objects). Owner setup: docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One production deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  # A job-level `if` cannot read secrets, so this job reads them into env and reports whether all
  # three are set. Without them (a fork, or before the owner configures the repository) `deploy`
  # is skipped, not failed.
  secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy skipped: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and DATABASE_URL must all be set (docs/deploy.md)"
          fi
  deploy:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: production origin is set
        run: |
          if grep -q 'REPLACE-WITH-' apps/api/wrangler.jsonc; then
            echo "::error file=apps/api/wrangler.jsonc::env.production vars still hold the placeholder origin (docs/deploy.md, step 3)"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Neon's direct (non-pooled) URL: migrations never go through Hyperdrive. They run before the
      # deploy, so the new Worker never meets an older schema; write them backward compatible,
      # because the running Worker meets the new schema until the deploy finishes.
      - name: migrate
        run: pnpm --filter @cgis/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # apps/web's `tsc -b` reads the Worker's generated binding types (worker-configuration.d.ts).
      - name: worker types
        run: pnpm --filter @cgis/api types
      - name: web build
        run: pnpm --filter @cgis/web build
      # `deploy` is `wrangler deploy --minify`; the assets are uploaded from apps/web/dist.
      - name: deploy
        run: pnpm --filter @cgis/api run deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
